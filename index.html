<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Nils Frahm — la pédale</title>
<meta name="description" content="Nils Frahm, six works. Hold the sustain pedal to make the room resonate." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,200;0,300;0,400;1,200;1,300;1,400&display=swap" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ─── The Hall: a near-imperceptible volumetric warmth ─── -->
<div id="hall" aria-hidden="true">
  <div class="hall-bloom"></div>
  <div class="hall-grain"></div>
</div>

<!-- ─── Loader: the cantus firmus ─── -->
<div id="loader">
  <svg class="loader-svg" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <line id="cantus" x1="120" y1="300" x2="120" y2="300" stroke="#EAE5DA" stroke-width="0.5" opacity="0.85"/>
  </svg>
  <div class="loader-word" aria-hidden="true">
    <em>nils frahm</em>
  </div>
</div>

<!-- ─── Frame: four hairline corners, italic only ─── -->
<header class="frame" aria-hidden="true">
  <span class="frame-tl"><em>nils frahm</em> — six works held</span>
  <span class="frame-tr">saal 3 · funkhaus berlin</span>
  <span class="frame-bl">52°29′ N · 13°30′ E</span>
  <span class="frame-br" id="frame-now">—</span>
</header>

<!-- ─── La Pédale: the centred column of works ─── -->
<main id="page" role="main">
  <div class="cantus-rule" aria-hidden="true"><span></span></div>

  <ol id="works" role="list">
    <!-- injected by script -->
  </ol>

  <div id="caption" aria-live="polite">
    <p id="cap-epigraph"><em>—</em></p>
    <div id="cap-meta">
      <span class="cap-room">—</span>
      <span class="cap-sep"></span>
      <span class="cap-method">—</span>
    </div>
  </div>

  <!-- The Resonance: the horizontal sustain line drawn from cursor -->
  <div id="resonance" aria-hidden="true">
    <div class="res-line res-l"></div>
    <div class="res-line res-r"></div>
    <div class="res-halo"></div>
  </div>
</main>

<!-- ─── Bottom whisper: invitation to hold the pedal ─── -->
<footer class="invitation">
  <p id="invite">
    <em>hold</em>&nbsp;&nbsp;the room to listen
    <span class="invite-key">— space, or press</span>
  </p>
  <a id="colophon" href="https://velocity.studio" target="_blank" rel="noopener noreferrer" aria-label="Velocity atelier">
    <em>a Velocity atelier work</em>
    <span class="colo-sep"></span>
    <span class="colo-year">MMXXVI</span>
  </a>
</footer>

<!-- ─── Cursor: la touche, a thin baton with a soft halo ─── -->
<div id="cursor" aria-hidden="true">
  <div class="cur-baton"></div>
  <div class="cur-halo"></div>
</div>

<script src="script.js"></script>

<!-- Engine: PASSED | All Signatures: YES | Anti-Patterns: 0 -->
<!-- A Velocity atelier work — © MMXXVI -->
</body>
</html>
